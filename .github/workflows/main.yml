name: macOS Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check macOS
        run: |
          sw_vers
          uname -a

      - name: Check compiler
        run: |
          clang --version

      - name: Compile target
        run: |
          clang target.c -o target

      - name: Run target
        run: |
          ./target
